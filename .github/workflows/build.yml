name: Build BSTC MCQ Practice APK

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract the project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ls -la

          ZIP=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if unzip -Z1 "$candidate" 2>/dev/null | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              ZIP="$candidate"
              break
            fi
          done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -not -path './build_workspace/*' -printf '%T@ %p\n' | sort -rn | cut -d' ' -f2-)

          rm -rf build_workspace
          mkdir -p build_workspace

          if [ -n "$ZIP" ]; then
            echo "Using project ZIP: $ZIP"
            unzip -q -o "$ZIP" -d build_workspace || { echo "::error::Could not unzip $ZIP"; exit 1; }
            BASE="build_workspace"
          elif find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | grep -q .; then
            BASE="."
          else
            echo "::error::No ZIP with an Android project found. Upload BSTC_MCQ_Practice_Project.zip to the repository ROOT."
            exit 1
          fi

          SETTINGS=$(find "$BASE" -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' -not -path '*/.git/*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found after extraction."
            find "$BASE" -maxdepth 3 | head -80
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -uo pipefail
          SDKM="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            [ -f gradlew ] && chmod +x gradlew || true
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Build finished but no debug APK was found."
            exit 1
          fi
          mkdir -p apk_out
          cp "$APK" apk_out/BSTC-MCQ-Practice-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSTC-MCQ-Practice-debug-apk
          path: apk_out/BSTC-MCQ-Practice-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          java -version 2>&1 || true
          gradle --version 2>&1 | head -20 || true
          find "${PROJECT_DIR:-.}" -maxdepth 3 -not -path '*/.git/*' -not -path '*/build/*' | head -100 || true
          echo "::error::Build failed. Open the 'Build debug APK' step and read the first 'e:' error line."
